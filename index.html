<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>心臓人狼 引っ越し中</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#11152a;color:#efe8d4;font-family:system-ui,sans-serif}</style></head>
<body><p>心臓人狼は shinzoujinro.com に引っ越しました。移動しています…</p>
<script>
// 心臓人狼の引っ越し用。旧アドレス（pteratakahashi.github.io/shinzou-jinrou）と同じ場所なので、旧アドレスの端末内の保存を読み、新アドレスへ #sjmig= で渡す。
// 渡すのは心臓人狼の保存（hw2_*）とログイン（sb-…）だけ。行き先は shinzoujinro.com に限る
(function(){
  let r='https://shinzoujinro.com/';
  try{const u=new URL(new URLSearchParams(location.search).get('r')||r);if(/^https?:$/.test(u.protocol)&&/^(www\.)?shinzoujinro\.com$/.test(u.hostname))r=u.href.split('#')[0]}catch(e){}
  let v='none';
  try{const d={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^hw2_|^sb-evxljdiiyzynvhcznpou-/.test(k))d[k]=localStorage.getItem(k)}
    if(Object.keys(d).length){const by=new TextEncoder().encode(JSON.stringify(d));let b='';for(const x of by)b+=String.fromCharCode(x);v=btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}}catch(e){}
  location.replace(r+'#sjmig='+v);
})();
</script></body></html>
